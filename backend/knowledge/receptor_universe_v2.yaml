      - {symbol: CD44,     uniprot: P16070, role: "Hyaluronic acid receptor; muscle stem cell marker"}
      - {symbol: NOTCH1,   uniprot: P46531, role: "Notch; satellite cell quiescence"}
      - {symbol: NOTCH2,   uniprot: Q04721, role: "Notch; muscle development"}
      - {symbol: ROBO1,    uniprot: Q9Y6N7, role: "Slit receptor; muscle stem migration"}
      - {symbol: ITGA1,    uniprot: P56199, role: "Integrin α1; collagen IV/laminin receptor"}
